<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>MAX VPN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101114;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{padding:25px;font-size:29px;font-weight:bold}
.logo{
 display:inline-flex;align-items:center;gap:10px;
 color:#fff
}
.logo-m{
 background:#55565b;color:white;border-radius:13px;
 width:43px;height:43px;display:grid;
 place-items:center;font-size:29px
}
.card{
 margin:16px;padding:24px 18px;
 background:#1c1d22;border-radius:23px
}
h2{font-size:22px}
p{color:#aeb2bd;line-height:1.5}
input{
 width:100%;padding:17px;margin:15px 0;
 background:#292b32;border:1px solid #454752;
 border-radius:13px;color:white;font-size:17px;
 text-align:center;outline:none
}
button{
 width:100%;padding:16px;border:0;
 border-radius:13px;background:#287fff;
 color:white;font-size:17px;font-weight:bold;
 cursor:pointer
}
button:active{transform:scale(.98)}
.message{margin-top:17px;font-size:14px}
.hidden{display:none}
.code-icon{font-size:48px;margin:10px}
.footer{color:#777;margin:30px;font-size:12px}
.menu{
 display:flex;gap:10px;margin:16px
}
.menu button{background:#292b32}
.menu button.active{background:#287fff}
</style>
</head>
<body>

<header>
 <div class="logo">
  <span class="logo-m">M</span>
  MAX VPN
 </div>
</header>

<div class="menu">
 <button class="active" onclick="showPage('access',this)">
  🔑 Доступ
 </button>
 <button onclick="showPage('servers',this)">
  🌍 Серверы
 </button>
</div>

<div class="card" id="access">
 <div class="code-icon">🔐</div>
 <h2>Активация MAX VPN</h2>
 <p>Введи свой специальный код приглашения</p>

 <input id="code"
 placeholder="ВВЕДИ КОД"
 maxlength="40"
 autocomplete="off">

 <button onclick="activate()">
  АКТИВИРОВАТЬ
 </button>

 <div class="message" id="message"></div>
</div>

<div class="card hidden" id="servers">
 <h2>🌍 Выбор сервера</h2>
 <p>Список доступных стран MAX VPN</p>
 <p>🇩🇪 Германия</p>
 <p>🇫🇮 Финляндия</p>
 <p>🇸🇪 Швеция</p>
 <p>🇳🇱 Нидерланды</p>
 <p>🇺🇸 США</p>
</div>

<div class="footer">
 MAX VPN • Version 3.0<br>
 Access system
</div>

<script>
function showPage(page,button){
 document.getElementById('access').classList.toggle(
  'hidden',page!=='access'
 );
 document.getElementById('servers').classList.toggle(
  'hidden',page!=='servers'
 );
 document.querySelectorAll('.menu button').forEach(b=>
  b.classList.remove('active')
 );
 button.classList.add('active');
}

function activate(){
 const code=document.getElementById('code')
 .value.trim().toUpperCase();
 const message=document.getElementById('message');

 if(!code){
  message.style.color='#ff7777';
  message.innerText='Введи код приглашения!';
  return;
 }

 message.style.color='#ffbd58';
 message.innerText=
 'Демо: проверка кодов ещё не подключена.';
}
</script>

</body>
</html>
